name: logits-parity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  push-noop:
    name: Manual-only logits parity
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Logits parity requires a self-hosted macOS ARM64 runner and runs manually only."

  qwen-logits-parity:
    name: Qwen logits parity (Transformers vs mlx-lm)
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 180
    env:
      HF_HOME: ${{ runner.temp }}/hf-cache
      VRYX_COMPARE_MODELS: Qwen/Qwen2-0.5B-Instruct,Qwen/Qwen3.5-9B
      VRYX_COMPARE_MAX_NEW_TOKENS: "8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}
          key: hf-qwen-logits-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('nodeAndWorker/scripts/compare_qwen_logits.py') }}
          restore-keys: |
            hf-qwen-logits-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r nodeAndWorker/python-inference/requirements.txt

      - name: Compare top-10 logits
        run: |
          cd nodeAndWorker
          ./scripts/compare_qwen_logits.py
