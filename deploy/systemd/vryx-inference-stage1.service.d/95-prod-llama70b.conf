[Service]
PermissionsStartOnly=true
Environment=VRYX_MLX_LM_DIRECT=1
Environment=VRYX_STAGE1_PREWARM=0
Environment=VRYX_DIST_MODEL=NousResearch/Llama-2-70b-hf
Environment=VRYX_DIST_MIN_WORKERS=2
Environment=VRYX_DIST_MAX_WORKERS=8
Environment=VRYX_DIST_USE_ALL_COMPATIBLE_PEERS=1
Environment=VRYX_DIST_HARD_CAP_PEERS=12
Environment=VRYX_DIST_MAX_TOKENS=12288
Environment=VRYX_DIST_TIMEOUT_SEC=1800
Environment=VRYX_PIPELINE_STEP_TIMEOUT_SEC=900
Environment=VRYX_SHARD_READY_TIMEOUT_SEC=180
Environment=VRYX_SHARD_INIT_TIMEOUT_SEC=90
Environment=VRYX_SHARD_INIT_ATTEMPTS=1
Environment=VRYX_SHARD_LOAD_TIMEOUT_SEC=240
Environment=VRYX_SHARD_BUILD_TIMEOUT_SEC=240
Environment=VRYX_SHARD_BASE_DIR=/var/lib/vryx-shards
Environment=VRYX_SHARD_TRANSFER_MODE=range
Environment=VRYX_WEIGHT_QUANTIZATION=q4
Environment=VRYX_GGUF_PREPARED_SESSION=prepared-llama2-70b-gguf-live
Environment=VRYX_GGUF_PREPARED_SESSION_DIR=/mnt/vryx-storage/prepared-models/prepared-llama2-70b-gguf-live
Environment=VRYX_MIN_SHARD_FREE_MB=20480
Environment=VRYX_SHARD_READY_POLL_SEC=0.8
Environment=VRYX_SHARD_READY_POLL_SLOW_SEC=6
Environment=VRYX_SHARD_READY_POLL_SLOW_AFTER=40
Environment=VRYX_POOL_PREFERENCE=auto
Environment=VRYX_API_URL=https://vryx.eu
Environment=VRYX_SHARD_DOWNLOAD_BASE_URL=https://vryx.eu
Environment=VRYX_HIDDEN_TRANSPORT=fp16
Environment=VRYX_HIDDEN_QUIC=0
Environment=VRYX_PIPELINE_CHAIN_MODE=initiator_sequential
Environment=VRYX_WORKER_KV_CACHE=true
Environment=VRYX_SAMPLING_TEMPERATURE=0
Environment=VRYX_SAMPLING_TOP_P=0.75
Environment=VRYX_SAMPLING_TOP_K=20
Environment=VRYX_REPETITION_PENALTY=1.0
Environment=VRYX_REPETITION_GUARD=true
Environment=VRYX_DECODE_MICROBATCH=1
Environment=VRYX_DECODE_MICROBATCH_CAP=32
Environment=VRYX_PREFIX_CACHE=1
Environment=VRYX_PREFIX_CACHE_MIN_TOKENS=32
Environment=VRYX_MLX_ALLOW_Q4_HIDDEN=1
Environment=VRYX_MLX_DTYPE=fp16
Environment=VRYX_DIST_WAIT_FOR_MIN_WORKERS=1
Environment=VRYX_DIST_WAIT_FOR_MIN_WORKERS_TIMEOUT_SEC=20
Environment=VRYX_DIST_WAIT_FOR_MIN_WORKERS_POLL_SEC=1
Environment=VRYX_POOL_REPLICATION_FACTOR=0
Environment=VRYX_POOL_KEEP_SHARDS=true
Environment=VRYX_MLX_LM_MAX_TOKENS=12288
Environment=VRYX_MODEL_LOCAL_ONLY=0
Environment=VRYX_MODEL_SNAPSHOT_DIR=
Environment=HF_HOME=/mnt/vryx-storage/vryx-hf
Environment=HF_HUB_CACHE=/mnt/vryx-storage/vryx-hf
Environment=HF_TOKEN_FILE=/home/ubuntu/.cache/huggingface/token
Environment=HF_DOWNLOAD_MAX_WORKERS=16
Environment=HF_DOWNLOAD_ALLOW_PATTERNS=*.json,tokenizer*,*.model,*.tiktoken,merges.txt,vocab.*,special_tokens_map.json,generation_config.json
ExecStartPre=/usr/bin/install -d -m 0755 -o ubuntu -g ubuntu /var/lib/vryx-shards
ExecStartPre=/usr/bin/install -d -m 0755 -o ubuntu -g ubuntu /mnt/vryx-storage/vryx-hf
ExecStartPre=/usr/local/bin/vryx-shard-preflight /var/lib/vryx-shards
