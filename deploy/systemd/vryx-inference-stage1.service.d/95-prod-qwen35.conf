[Service]
Environment=VRYX_MLX_LM_DIRECT=1
Environment=VRYX_DIST_MODEL=Qwen/Qwen3.5-9B
Environment=VRYX_DIST_MIN_WORKERS=1
Environment=VRYX_DIST_MAX_WORKERS=1
Environment=VRYX_DIST_MAX_TOKENS=512
Environment=VRYX_POOL_PREFERENCE=auto
Environment=VRYX_SHARD_BASE_DIR=/var/lib/vryx-shards
Environment=VRYX_HIDDEN_QUIC=1
ExecStartPre=/usr/bin/install -d -m 0755 -o ubuntu -g ubuntu /var/lib/vryx-shards
ExecStartPre=/bin/bash -lc 'test "$(df -Pm /var/lib/vryx-shards | awk "NR==2 {print \\$4}")" -ge "${VRYX_MIN_SHARD_FREE_MB:-10240}"'
