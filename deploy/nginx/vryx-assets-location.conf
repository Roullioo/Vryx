# Vite immutable assets.
# Must be declared before the SPA fallback `location /` so missing chunks never
# return index.html as text/html, which breaks strict module MIME checks.
location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}
