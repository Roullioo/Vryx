name: Build Rust daemon Linux artifact

on:
  workflow_dispatch:
  push:
    paths:
      - 'nodeAndWorker/rust-daemon/**'
      - '.github/workflows/build-rust-daemon-linux.yml'

jobs:
  build-linux:
    runs-on: [self-hosted, vryx-builder]
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Use rustup toolchain
        run: |
          set -euo pipefail
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustc" --version
          "$HOME/.cargo/bin/cargo" --version
      - name: Build daemon
        working-directory: nodeAndWorker/rust-daemon
        run: cargo build --release --locked
      - name: Prepare artifact
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp nodeAndWorker/target/release/rust-daemon artifact/vryx-daemon-linux-x86_64
          chmod +x artifact/vryx-daemon-linux-x86_64
          git rev-parse --short HEAD > artifact/commit.txt
          sha256sum artifact/vryx-daemon-linux-x86_64 > artifact/vryx-daemon-linux-x86_64.sha256
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vryx-daemon-linux-x86_64
          path: artifact/*
          if-no-files-found: error
