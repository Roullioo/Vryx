name: CI Rust Linux

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  rust-daemon-linux:
    name: cargo fmt, clippy, test, release build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -p rust-daemon -- -D warnings

      - name: Test rust-daemon
        run: cargo test -p rust-daemon

      - name: Build rust-daemon
        run: cargo build --release --locked -p rust-daemon

      - name: Package rust-daemon artifact
        run: |
          mkdir -p dist
          cp target/release/rust-daemon dist/rust-daemon-linux-x86_64
          sha256sum dist/rust-daemon-linux-x86_64 > dist/rust-daemon-linux-x86_64.sha256

      - name: Upload rust-daemon Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-daemon-linux-x86_64
          path: |
            dist/rust-daemon-linux-x86_64
            dist/rust-daemon-linux-x86_64.sha256
          if-no-files-found: error
